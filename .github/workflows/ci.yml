name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ticketing/db generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration

  build-push:
    needs: lint-typecheck-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ticketing-web:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/ticketing-web:latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/bot/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ticketing-bot:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/ticketing-bot:latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/db/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ticketing-migrate:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/ticketing-migrate:latest

      # Pinned + checksum-verified (replaces `kustomize`, which ran an
      # unpinned npm package while this job holds a token that can push to main).
      - name: Install kustomize
        env:
          KUSTOMIZE_VERSION: v5.4.3
          KUSTOMIZE_SHA256: 3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7
        run: |
          curl -fsSL -o /tmp/kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  /tmp/kustomize.tgz" | sha256sum -c -
          tar -xzf /tmp/kustomize.tgz -C /tmp kustomize
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
      - name: Bump image tags for ArgoCD (GitOps commit)
        run: |
          cd deploy/overlays/prod
          kustomize edit set image \
            ghcr.io/${{ github.repository_owner }}/ticketing-web:${{ steps.meta.outputs.sha }} \
            ghcr.io/${{ github.repository_owner }}/ticketing-bot:${{ steps.meta.outputs.sha }} \
            ghcr.io/${{ github.repository_owner }}/ticketing-migrate:${{ steps.meta.outputs.sha }}
          cd -
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): bump images to ${{ steps.meta.outputs.sha }}" || echo "nothing to commit"
          git push
